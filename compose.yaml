services:
  chordflow:
    image: chordflow:${CHORDFLOW_TAG:-0.1.0}
    build:
      context: .
      args:
        VCS_REF: ${CHORDFLOW_TAG:-local}
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
